name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install pandas pytest
      - name: Compile Python sources
        run: python -m compileall -q app.py src tools tests
      - name: Test 2025 schema preparation
        run: python -m pytest -q tests/test_prepare_2025.py
      - name: Validate repository evidence
        run: python tools/validate_repository.py
