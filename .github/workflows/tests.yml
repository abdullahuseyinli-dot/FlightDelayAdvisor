name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,models,plots]"
      - name: Compile Python sources
        run: python -m compileall -q app.py src tools tests
      - name: Lint research package and tests
        run: python -m ruff check src/flightdelaybench tests
      - name: Type-check research package
        run: python -m mypy src/flightdelaybench
      - name: Test source-only repository
        run: python -m pytest -q -m "not integration and not slow and not confirmation"
      - name: Validate repository evidence
        run: python tools/validate_repository.py
      - name: Validate documentation and report-backed tables
        run: python tools/validate_documentation.py
      - name: Build source and wheel distributions
        run: python -m build
